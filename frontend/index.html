<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВтораРъка - Купи и Продай</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo" onclick="location.reload()"><i class="fa-solid fa-tags"></i> ВтораРъка</div>
        <div class="nav-buttons">
            <button id="loginBtn" class="btn-outline">Вход</button>
            <button id="registerBtn" class="btn-outline">Регистрация</button>
            <button id="profileBtn" class="btn-outline" style="display: none;">Моят профил</button>
            <button id="addAdBtn" class="btn-primary" style="display: none;"><i class="fa-solid fa-plus"></i> Добави обява</button>
            <button id="logoutBtn" class="btn-outline" style="display: none;">Изход</button>
        </div>
    </header>

    <section class="hero-section">
        <h1>Открий страхотни находки</h1>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Какво търсиш днес?" />
            <select id="sortSelect">
                <option value="newest">Най-нови</option>
                <option value="priceAsc">Най-евтини</option>
                <option value="priceDesc">Най-скъпи</option>
            </select>
            <button id="searchBtn" class="btn-search">Търси</button>
        </div>
    </section>

    <main class="container">
        <aside class="sidebar">
            <h3>Категории</h3>
            <ul id="categoryList">
                <li class="active" onclick="filterByCategory('Всички')">Всички</li>
                <li onclick="filterByCategory('Електроника')">Електроника</li>
                <li onclick="filterByCategory('Мода')">Мода</li>
                <li onclick="filterByCategory('Дом и градина')">Дом и градина</li>
                <li onclick="filterByCategory('Авто')">Авто</li>
                <li onclick="filterByCategory('Спорт')">Спорт</li>
            </ul>
        </aside>

        <div style="flex: 1;">
            <h2 id="pageTitle" class="section-title">Последни обяви</h2>
            <div class="items-grid" id="itemsContainer"><p>Зареждане на обяви...</p></div>
        </div>
    </main>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('loginModal')">&times;</span>
            <h2>Вход</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Имейл" required>
                <input type="password" id="loginPassword" placeholder="Парола" required>
                <button type="submit" class="btn-primary">Влез</button>
            </form>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('registerModal')">&times;</span>
            <h2>Регистрация</h2>
            <form id="registerForm">
                <input type="text" id="regFirstName" placeholder="Име" required>
                <input type="text" id="regLastName" placeholder="Фамилия" required>
                <input type="email" id="regEmail" placeholder="Имейл" required>
                <input type="password" id="regPassword" placeholder="Парола" required>
                <input type="text" id="regPhone" placeholder="Телефон" required>
                <button type="submit" class="btn-primary">Регистрация</button>
            </form>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content profile-card">
            <span class="close" onclick="closeModal('profileModal')">&times;</span>
            <div class="profile-header">
                <div class="profile-avatar"><i class="fa-solid fa-user-tie"></i></div>
                <h2 id="profileFullName">Потребител</h2>
            </div>
            <div class="profile-body">
                <div class="info-group"><label>Имейл:</label><span id="displayEmail">-</span></div>
                <div class="info-group"><label>Телефон:</label><span id="displayPhone">-</span></div>
                <hr>
                <div class="profile-stats">
                    <div class="stat-item"><strong id="myAdsCount">0</strong><span>Моите обяви</span></div>
                </div>
            </div>
        </div>
    </div>

    <div id="addAdModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('addAdModal')">&times;</span>
            <h2>Публикувай обява</h2>
            <form id="addAdForm">
                <input type="text" id="itemTitle" placeholder="Заглавие" required>
                <input type="number" id="itemPrice" placeholder="Цена (лв.)" required>
                <select id="itemCategory" style="width:100%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ddd;">
                    <option value="Електроника">Електроника</option>
                    <option value="Мода">Мода</option>
                    <option value="Спорт">Спорт</option>
                    <option value="Дом и градина">Дом и градина</option>
                    <option value="Авто">Авто</option>
                </select>
                <input type="text" id="itemCity" placeholder="Град" required>
                <label style="display:block; margin-top:10px; font-size:14px; font-weight:600;">Снимка:</label>
                <input type="file" id="itemFile" accept="image/*" style="border:none; padding:5px 0;">
                <textarea id="itemDesc" placeholder="Описание на обявата..." style="width:100%; height:100px; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ddd; font-family: inherit;"></textarea>
                <button type="submit" class="btn-primary" style="width:100%;">Публикувай обява</button>
            </form>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close" onclick="closeModal('detailsModal')">&times;</span>
            <div id="detailsContent"></div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-bottom">&copy; 2026 ВтораРъка. Всички права запазени.</div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
